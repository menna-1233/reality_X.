services:
  - type: web
    name: realityx-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free

    envVars:
      # --- AI backend ---
      - key: AI_BACKEND
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # Set these manually in Render dashboard (sensitive):
      # GROQ_API_KEY         → console.groq.com → free API key
      # SUPABASE_URL         → Supabase dashboard → Project Settings → API
      # SUPABASE_SERVICE_ROLE_KEY → same place, service_role key
      # DEFAULT_COMMUNITY_ID → your seeded community UUID
