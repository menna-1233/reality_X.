<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Set lang/dir before first paint so a returning visitor who switched
      // to Arabic doesn't see a flash of English/LTR on reload. Kept in sync
      // with the "urbaneye.lang" logic in src/i18n/config.ts. English is the
      // default; only Arabic needs an explicit override here.
      (function () {
        try {
          if (window.localStorage.getItem("urbaneye.lang") === "ar") {
            document.documentElement.lang = "ar";
            document.documentElement.dir = "rtl";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0908" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>RealityX</title>
    <meta
      name="description"
      content="RealityX — Turning Real-World Problems into AI-Powered Solutions. بلّغ عن أي مشكلة في مجتمعك بصورة، والـ AI يحللها ويحدد نوعها وخطورتها."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
