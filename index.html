<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Set lang/dir before first paint so a returning visitor who switched
      // to English doesn't see a flash of Arabic/RTL on reload. Kept in sync
      // with the "urbaneye.lang" logic in src/i18n/config.ts.
      (function () {
        try {
          if (window.localStorage.getItem("urbaneye.lang") === "en") {
            document.documentElement.lang = "en";
            document.documentElement.dir = "ltr";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0908" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>UrbanEye AI</title>
    <meta
      name="description"
      content="UrbanEye AI — بلّغ عن أي مشكلة في مجتمعك بصورة، والـ AI يحللها ويحدد نوعها وخطورتها."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
